version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: zwmon_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zwmon_backend
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017/
      - TZ=Asia/Makassar
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/venv # Prevent overriding container venv

volumes:
  mongo_data:
